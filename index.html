<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Broadcast | Live Monitor</title>
    <style>
        :root {
            --bg-color: #f3f4f6;
            --primary: #1e3a8a;
            --secondary: #3b82f6;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --dark: #111827;
            --white: #ffffff;
            --card-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }

        body { background-color: var(--bg-color); color: var(--dark); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* Header */
        header { background: var(--primary); color: var(--white); padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; box-shadow: var(--card-shadow); z-index: 10; }
        .header-title { font-size: 1.5rem; font-weight: 800; letter-spacing: 1px; }
        
        .status-badge { background: rgba(255,255,255,0.2); padding: 5px 15px; border-radius: 50px; font-size: 0.9rem; font-weight: 600; display: flex; align-items: center; gap: 8px; }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--success); box-shadow: 0 0 10px var(--success); }

        /* Main Layout */
        .dashboard-container { display: flex; flex: 1; padding: 20px; gap: 20px; overflow: hidden; }

        /* Coluna Esquerda: Ações e Testes */
        .panel-left { flex: 1; max-width: 400px; display: flex; flex-direction: column; gap: 20px; overflow-y: auto; padding-right: 10px; }
        
        .card { background: var(--white); border-radius: 12px; padding: 20px; box-shadow: var(--card-shadow); }
        .card-title { font-size: 1.1rem; font-weight: 700; color: var(--primary); margin-bottom: 15px; border-bottom: 2px solid #f3f4f6; padding-bottom: 10px; }

        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .btn-full { grid-column: span 2; }
        
        .btn { padding: 12px; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; transition: 0.2s; color: var(--white); text-transform: uppercase; font-size: 0.9rem; }
        .btn:hover { filter: brightness(1.1); transform: translateY(-1px); }
        .btn-blue { background: var(--secondary); }
        .btn-green { background: var(--success); }
        .btn-red { background: var(--danger); }
        .btn-yellow { background: var(--warning); color: var(--dark); }

        /* Coluna Direita: Feedback Visual e Logs */
        .panel-right { flex: 2; display: flex; flex-direction: column; gap: 20px; overflow: hidden; }

        .visual-feedback { background: var(--dark); border-radius: 12px; padding: 20px; color: var(--white); display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 180px; position: relative; box-shadow: inset 0 0 20px rgba(0,0,0,0.5); }
        .visual-title { position: absolute; top: 15px; left: 15px; font-size: 0.8rem; color: #888; font-weight: bold; text-transform: uppercase; }
        
        /* Espelho do Placar */
        .mirror-placar { display: flex; align-items: center; gap: 20px; font-size: 2.5rem; font-weight: 900; font-family: 'Arial Black', sans-serif; }
        .mirror-team { background: #333; padding: 10px 20px; border-radius: 8px; }
        .mirror-score { color: var(--warning); }
        .mirror-time { font-size: 1.5rem; background: #222; padding: 5px 15px; border-radius: 5px; color: #aaa; }

        .logs-card { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .logs-container { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding: 5px; }
        .log-item { background: #f9fafb; border-left: 4px solid #ccc; padding: 12px; border-radius: 6px; font-size: 0.9rem; font-weight: 600; animation: slideIn 0.3s ease-out; }
        .log-item.info { border-left-color: var(--secondary); }
        .log-item.success { border-left-color: var(--success); }
        .log-item.warning { border-left-color: var(--warning); }
        .log-time { font-size: 0.75rem; color: #6b7280; display: block; margin-bottom: 4px; }

        /* Modal Base */
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); display: none; justify-content: center; align-items: center; z-index: 100; backdrop-filter: blur(3px); }
        .modal-overlay.active { display: flex; }
        .modal-content { background: var(--white); width: 100%; max-width: 400px; border-radius: 12px; padding: 25px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); }
        .modal-header { font-size: 1.2rem; font-weight: 800; color: var(--primary); margin-bottom: 15px; }
        .modal-input { width: 100%; padding: 12px; border: 1px solid #d1d5db; border-radius: 8px; margin-bottom: 10px; font-size: 1rem; outline: none; }
        .modal-input:focus { border-color: var(--secondary); }
        .modal-actions { display: flex; gap: 10px; margin-top: 15px; }

        @keyframes slideIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
        
        /* Toast */
        .toast { position: fixed; bottom: -60px; left: 50%; transform: translateX(-50%); background: var(--dark); color: white; padding: 12px 25px; border-radius: 50px; font-weight: bold; transition: bottom 0.3s; z-index: 1000; }
        .toast.show { bottom: 30px; }
    </style>
</head>
<body>

    <header>
        <div class="header-title">OVERLAY BROADCAST UI</div>
        <div class="status-badge" id="status-badge">
            <div class="status-dot"></div> Robô Ativo
        </div>
    </header>

    <div class="dashboard-container">
        <!-- PAINEL ESQUERDO: CONTROLES -->
        <div class="panel-left">
            
            <div class="card">
                <div class="card-title">⚽ Forçar Gráficos (Testes)</div>
                <div class="btn-grid">
                    <button class="btn btn-blue btn-full" onclick="abrirModal('gol')">Simular Gol</button>
                    <button class="btn btn-yellow" onclick="abrirModal('cartao')">Cartão</button>
                    <button class="btn btn-green" onclick="abrirModal('substituicao')">Substituição</button>
                </div>
            </div>

            <div class="card">
                <div class="card-title">⏱ Controle do Placar</div>
                <div class="btn-grid">
                    <button class="btn btn-blue" onclick="enviarComandoPlacar('start')">Iniciar Tempo</button>
                    <button class="btn btn-red" onclick="enviarComandoPlacar('reset')">Zerar Placar</button>
                    <button class="btn btn-green btn-full" onclick="abrirModal('acrescimo')">Inserir Acréscimo</button>
                    <button class="btn btn-yellow btn-full" onclick="enviarComandoPlacar('off')">Forçar Status "OFF"</button>
                </div>
            </div>

        </div>

        <!-- PAINEL DIREITO: FEEDBACK E LOGS -->
        <div class="panel-right">
            
            <!-- Espelho do OBS -->
            <div class="visual-feedback">
                <div class="visual-title">🔴 Feedback Visual (TV)</div>
                <div class="mirror-placar" id="mirror-placar">
                    <span class="mirror-team" id="mirror-home">OFF</span>
                    <span class="mirror-score" id="mirror-score-home">-</span>
                    <span>x</span>
                    <span class="mirror-score" id="mirror-score-away">-</span>
                    <span class="mirror-team" id="mirror-away">OFF</span>
                </div>
                <div class="mirror-time" style="margin-top: 15px;" id="mirror-time">00:00</div>
            </div>

            <!-- Terminal de Logs -->
            <div class="card logs-card">
                <div class="card-title" style="display: flex; justify-content: space-between;">
                    <span>Histórico do Sistema</span>
                    <button class="btn btn-blue" style="padding: 5px 15px;" id="btn-force-fetch">Forçar Leitura ESPN</button>
                </div>
                <div class="logs-container" id="logs-area">
                    <!-- Logs entram aqui -->
                </div>
            </div>

        </div>
    </div>

    <!-- Modais Dinâmicos -->
    <div class="modal-overlay" id="modal">
        <div class="modal-content">
            <div class="modal-header" id="modal-title">Título</div>
            <div id="modal-body"></div>
            <div class="modal-actions">
                <button class="btn" style="background: #9ca3af; flex: 1;" onclick="fecharModal()">Cancelar</button>
                <button class="btn btn-blue" style="flex: 1;" id="modal-confirm">Enviar</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast">Ação executada com sucesso!</div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, update, query, limitToLast } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

        // CREDENCIAIS DO SEU FIREBASE
        const config = {
            apiKey: "AIzaSyBH7VzRejR_jOg-ogO8mLw162PN5QKODeI",
            authDomain: "termosm-6fed5.firebaseapp.com",
            projectId: "termosm-6fed5",
            databaseURL: "https://termosm-6fed5-default-rtdb.firebaseio.com",
            storageBucket: "termosm-6fed5.firebasestorage.app",
            messagingSenderId: "161850041087",
            appId: "1:161850041087:web:2dc4f19760f44475fde2ca"
        };
        const app = initializeApp(config);
        const db = getDatabase(app);

        // --- FEEDBACK VISUAL (ESPELHO DO PLACAR) ---
        onValue(ref(db, 'tv/placar'), (snap) => {
            const data = snap.val();
            if(!data) return;

            const home = document.getElementById('mirror-home');
            const away = document.getElementById('mirror-away');
            const scoreHome = document.getElementById('mirror-score-home');
            const scoreAway = document.getElementById('mirror-score-away');
            const time = document.getElementById('mirror-time');

            if(data.status === 'off' || data.acao === 'reset') {
                home.innerText = "OFF"; away.innerText = "OFF";
                scoreHome.innerText = "-"; scoreAway.innerText = "-";
                time.innerText = "00:00";
            } else if (data.status === 'erro') {
                home.innerText = "ERRO"; away.innerText = "ERRO";
                time.innerText = "API ERROR";
            } else {
                home.innerText = data.homeAbbr || "CASA";
                away.innerText = data.awayAbbr || "FORA";
                scoreHome.innerText = data.homeScore ?? 0;
                scoreAway.innerText = data.awayScore ?? 0;
                time.innerText = data.clock || "00:00";
                if(data.added) time.innerText += ` (+${data.added})`;
            }
        });

        // --- SISTEMA DE LOGS ---
        const logsArea = document.getElementById('logs-area');
        onValue(query(ref(db, 'tv/logs'), limitToLast(20)), (snapshot) => {
            logsArea.innerHTML = '';
            snapshot.forEach((child) => {
                const data = child.val();
                const timeStr = new Date(data.timestamp).toLocaleTimeString('pt-BR');
                const div = document.createElement('div');
                div.className = `log-item ${data.tipo}`;
                div.innerHTML = `<span class="log-time">${timeStr}</span>${data.mensagem}`;
                logsArea.insertBefore(div, logsArea.firstChild);
            });
        });

        // Forçar leitura na ESPN
        document.getElementById('btn-force-fetch').onclick = () => {
            update(ref(db, 'tv/controle'), { forcarBusca: true });
            mostrarToast("Comando de verificação enviado ao servidor!");
        };

        // --- MODAIS DE TESTE MANUAIS ---
        const modal = document.getElementById('modal');
        const modalBody = document.getElementById('modal-body');
        const btnConfirm = document.getElementById('modal-confirm');

        window.abrirModal = function(tipo) {
            document.getElementById('modal-title').innerText = `Simular ${tipo.toUpperCase()}`;
            
            let html = `<input type="text" id="teste-time" class="modal-input" placeholder="Sigla do Time (Ex: CRU, FLA)">`;
            
            if (tipo === 'gol' || tipo === 'cartao') {
                html += `<input type="text" id="teste-jogador" class="modal-input" placeholder="Nome do Jogador">`;
                html += `<input type="text" id="teste-numero" class="modal-input" placeholder="Número da Camisa (Opcional)">`;
                if(tipo === 'cartao') {
                    html += `<select id="teste-cor" class="modal-input"><option value="amarelo">Amarelo</option><option value="vermelho">Vermelho</option></select>`;
                }
            } else if (tipo === 'substituicao') {
                html += `<input type="text" id="teste-sai" class="modal-input" placeholder="SAI: Nome do Jogador">
                         <input type="text" id="teste-entra" class="modal-input" placeholder="ENTRA: Nome do Jogador">`;
            } else if (tipo === 'acrescimo') {
                html = `<input type="number" id="teste-min" class="modal-input" placeholder="Minutos (Ex: 5)">`;
            }

            modalBody.innerHTML = html;
            modal.classList.add('active');

            btnConfirm.onclick = async () => {
                fecharModal();
                if(tipo === 'acrescimo') {
                    await update(ref(db, 'tv/placar'), { acao: 'acrescimo', added: document.getElementById('teste-min').value, timestamp: Date.now() });
                } else if (tipo === 'substituicao') {
                    let payload = {
                        team: document.getElementById('teste-time').value.toUpperCase(),
                        out: { nome: document.getElementById('teste-sai').value, num: "X" },
                        in: { nome: document.getElementById('teste-entra').value, num: "Y" },
                        timestamp: Date.now(), hide: false
                    };
                    await set(ref(db, 'substituicao'), payload);
                } else {
                    let payload = {
                        teamAbbr: document.getElementById('teste-time').value.toUpperCase(),
                        jogador: document.getElementById('teste-jogador').value,
                        numero: document.getElementById('teste-numero').value,
                        timestamp: Date.now()
                    };
                    if(tipo === 'cartao') payload.tipo = document.getElementById('teste-cor').value;
                    await set(ref(db, `tv/${tipo}`), payload);
                }
                mostrarToast(`Animação enviada para o OBS!`);
            };
        };

        window.fecharModal = () => modal.classList.remove('active');

        window.enviarComandoPlacar = async (acao) => {
            let payload = { acao: acao, status: acao, timestamp: Date.now() };
            if(acao === 'start') {
                // Mock para iniciar caso não tenha jogo real rodando
                payload = { ...payload, status: 'in', homeAbbr: 'CRU', awayAbbr: 'ADV', homeScore: 0, awayScore: 0, clock: "00:00" };
            }
            await set(ref(db, 'tv/placar'), payload);
            mostrarToast(`Placar atualizado para: ${acao.toUpperCase()}`);
        };

        function mostrarToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }
    </script>
</body>
</html>
