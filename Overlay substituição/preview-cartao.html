<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
        .card-container {
            position: fixed; bottom: 80px; left: 50px; display: flex; align-items: center; gap: 15px;
            opacity: 0; transform: translateX(-50px); transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .card-container.show { opacity: 1; transform: translateX(0); }

        .card-icon {
            width: 45px; height: 65px; border-radius: 6px; box-shadow: 2px 5px 15px rgba(0,0,0,0.4);
            transform: rotate(-10deg); border: 2px solid rgba(255,255,255,0.5);
        }
        .amarelo .card-icon { background: #fbbf24; }
        .vermelho .card-icon { background: #ef4444; }

        .info-box {
            background: rgba(20, 20, 20, 0.95); padding: 12px 25px; border-radius: 8px;
            border-left: 5px solid white; display: flex; flex-direction: column;
        }
        .cruzeiro .info-box { border-color: #3b82f6; }
        
        .title { color: #aaa; font-size: 0.75rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }
        .name { color: white; font-size: 1.4rem; font-weight: 900; text-transform: uppercase; }
    </style>
</head>
<body>
    <div class="card-container amarelo cruzeiro" id="graphic">
        <div class="card-icon"></div>
        <div class="info-box">
            <span class="title" id="tipo-cartao">CARTÃO AMARELO</span>
            <span class="name" id="nome-jogador">JOGADOR</span>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
        // USE SEU FIREBASE CONFIG AQUI
        const config = { databaseURL: "https://termosm-6fed5-default-rtdb.firebaseio.com" }; 
        const db = getDatabase(initializeApp(config));
        
        let lastTimestamp = 0;
        onValue(ref(db, 'tv/cartao'), (snap) => {
            const data = snap.val();
            if (!data || data.timestamp === lastTimestamp || Date.now() - data.timestamp > 10000) return;
            
            lastTimestamp = data.timestamp;
            document.getElementById('nome-jogador').innerText = data.jogador;
            document.getElementById('tipo-cartao').innerText = `CARTÃO ${data.tipo.toUpperCase()}`;
            
            const graphic = document.getElementById('graphic');
            graphic.className = `card-container ${data.tipo} ${data.isCruzeiro ? 'cruzeiro' : 'adversario'} show`;
            
            setTimeout(() => graphic.classList.remove('show'), 6000);
        });
    </script>
</body>
</html>
