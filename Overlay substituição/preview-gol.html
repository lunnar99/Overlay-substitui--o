<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Arial Black', Impact, sans-serif; }
        .gol-container {
            position: fixed; top: 100px; left: 50%; transform: translateX(-50%) scale(0);
            display: flex; flex-direction: column; align-items: center; opacity: 0;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .gol-container.show { transform: translateX(-50%) scale(1); opacity: 1; }
        
        .gol-title {
            font-size: 5rem; color: #ffffff; text-shadow: 0 5px 15px rgba(0,0,0,0.5);
            background: linear-gradient(45deg, #1e3a8a, #3b82f6);
            padding: 10px 60px; border-radius: 20px; text-transform: uppercase;
            animation: pulse 1.5s infinite alternate; letter-spacing: 5px; border: 4px solid white;
        }
        .gol-jogador {
            background: rgba(255,255,255,0.95); color: #1e3a8a; font-size: 2rem;
            padding: 10px 40px; border-radius: 50px; margin-top: -15px; box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            text-transform: uppercase; z-index: 10;
        }

        .adversario .gol-title { background: linear-gradient(45deg, #4b5563, #1f2937); }
        .adversario .gol-jogador { color: #111; }

        @keyframes pulse { 0% { transform: scale(1); } 100% { transform: scale(1.05); } }
    </style>
</head>
<body>
    <div class="gol-container" id="graphic">
        <div class="gol-title">GOOOL</div>
        <div class="gol-jogador" id="nome-jogador">JOGADOR</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
        // USE SEU FIREBASE CONFIG AQUI
        const config = { databaseURL: "https://termosm-6fed5-default-rtdb.firebaseio.com" }; 
        const db = getDatabase(initializeApp(config));
        
        let lastTimestamp = 0;
        onValue(ref(db, 'tv/gol'), (snap) => {
            const data = snap.val();
            if (!data || data.timestamp === lastTimestamp || Date.now() - data.timestamp > 10000) return;
            
            lastTimestamp = data.timestamp;
            document.getElementById('nome-jogador').innerText = data.jogador;
            
            const graphic = document.getElementById('graphic');
            graphic.className = `gol-container ${data.isCruzeiro ? 'cruzeiro' : 'adversario'} show`;
            
            setTimeout(() => graphic.classList.remove('show'), 7000); // Some após 7 segundos
        });
    </script>
</body>
</html>
