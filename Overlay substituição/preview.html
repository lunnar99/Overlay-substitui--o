<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Substituição OBS | Suspense Animado</title>
    <style>
        :root {
            --primary-blue: #1b168f;
            --out-color: #f14444;
            --in-color: #22c55e;
            --bg-white: #ffffff;
            --text-dark: #111827;
        }

        body { 
            margin: 0; padding: 0; width: 100vw; height: 100vh; 
            background: transparent; font-family: 'Segoe UI', system-ui, sans-serif; overflow: hidden;
        }

        /* Container Principal */
        .broadcast-container {
            position: fixed;
            bottom: 50px;
            left: 50px;
            display: flex;
            flex-direction: column;
            width: fit-content;
            min-width: 320px;
            max-width: 650px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.8s ease, transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* Revela o header do gráfico */
        .broadcast-container.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* Cabeçalho do Time */
        .broadcast-header {
            background: var(--primary-blue);
            color: #ffffff;
            padding: 12px 25px;
            font-weight: 900;
            font-size: 1.1rem;
            text-transform: uppercase;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            letter-spacing: 1px;
            border-top-left-radius: 12px;
            border-top-right-radius: 12px;
            border-bottom: 3px solid rgba(255, 255, 255, 0.15);
            z-index: 10;
        }

        /* Corpo que recebe o fundo branco */
        .broadcast-body {
            background: var(--bg-white);
            border-bottom-left-radius: 12px;
            border-bottom-right-radius: 12px;
            display: flex;
            flex-direction: column;
        }

        /* TRUQUE DA EXPANSÃO: O Wrapper cria o efeito de crescimento do fundo branco */
        .row-wrapper {
            display: grid;
            grid-template-rows: 0fr; /* Começa com altura 0 */
            transition: grid-template-rows 1s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .row-wrapper.animate-in {
            grid-template-rows: 1fr; /* Expande para o tamanho do conteúdo */
        }

        /* Oculta o que transbordar enquanto a altura é 0 */
        .player-row {
            overflow: hidden;
            min-height: 0;
        }

        /* Conteúdo interno da linha (dados dos jogadores) */
        .player-row-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 25px;
            gap: 20px;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.8s ease, transform 0.8s ease;
        }

        #wrap-out .player-row-inner {
            border-bottom: 1px solid #f0f0f0;
        }

        /* Só revela os dados após o fundo começar a crescer */
        .row-wrapper.animate-in .player-row-inner {
            opacity: 1;
            transform: translateY(0);
            transition-delay: 0.3s;
        }

        /* Lado esquerdo: Seta + Foto + Nome */
        .player-left {
            display: flex;
            align-items: center;
            gap: 15px;
            white-space: nowrap;
        }

        /* Seta Animada com atraso para reforçar suspense */
        .arrow-box {
            font-size: 1.4rem;
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.6s ease;
        }

        .row-wrapper.animate-in .arrow-box {
            opacity: 1;
            transform: translateY(0);
            transition-delay: 0.5s;
        }

        .arrow-box.out { color: var(--out-color); }
        .arrow-box.in { color: var(--in-color); }

        .player-photo {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #e5e7eb;
            display: none;
        }

        .player-name {
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--text-dark);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: none;
        }

        .player-number {
            font-size: 2.2rem;
            font-weight: 900;
            color: var(--primary-blue);
            font-family: 'Arial Black', Impact, sans-serif;
            line-height: 1;
            padding-left: 10px;
        }
    </style>
</head>
<body>

    <div class="broadcast-container" id="graphic">
        <div class="broadcast-header">
            <span id="obs-team">TIME</span>
            <span>SUBSTITUIÇÃO</span>
        </div>
        
        <div class="broadcast-body">
            <!-- 1. Wrapper SAI (Vermelha) -->
            <div class="row-wrapper" id="wrap-out">
                <div class="player-row">
                    <div class="player-row-inner">
                        <div class="player-left">
                            <div class="arrow-box out">▼</div>
                            <img id="img-out" class="player-photo">
                            <span id="name-out" class="player-name"></span>
                        </div>
                        <div class="player-number" id="num-out">00</div>
                    </div>
                </div>
            </div>

            <!-- 2. Wrapper ENTRA (Verde) -->
            <div class="row-wrapper" id="wrap-in">
                <div class="player-row">
                    <div class="player-row-inner">
                        <div class="player-left">
                            <div class="arrow-box in">▲</div>
                            <img id="img-in" class="player-photo">
                            <span id="name-in" class="player-name"></span>
                        </div>
                        <div class="player-number" id="num-in">00</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBH7VzRejR_jOg-ogO8mLw162PN5QKODeI",
            authDomain: "termosm-6fed5.firebaseapp.com",
            projectId: "termosm-6fed5",
            databaseURL: "https://termosm-6fed5-default-rtdb.firebaseio.com",
            storageBucket: "termosm-6fed5.firebasestorage.app",
            messagingSenderId: "161850041087",
            appId: "1:161850041087:web:2dc4f19760f44475fde2ca",
            measurementId: "G-ZFYXEQ34QL"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const graphic = document.getElementById('graphic');
        const teamName = document.getElementById('obs-team');
        const wrapOut = document.getElementById('wrap-out');
        const wrapIn = document.getElementById('wrap-in');

        let timeoutId;
        let lastTimestamp = 0;

        function renderPlayerDetails(playerObj, type) {
            const numEl = document.getElementById(`num-${type}`);
            const nameEl = document.getElementById(`name-${type}`);
            const imgEl = document.getElementById(`img-${type}`);

            numEl.innerText = playerObj.num;

            if (playerObj.img) {
                imgEl.src = playerObj.img;
                imgEl.style.display = 'block';
            } else {
                imgEl.style.display = 'none';
            }

            if (playerObj.nome) {
                nameEl.innerText = playerObj.nome;
                nameEl.style.display = 'inline';
            } else {
                nameEl.style.display = 'none';
            }
        }

        // COREOGRAFIA DE SUSPENSE E EXPANSÃO
        function startStorylineAnimation(data) {
            clearTimeout(timeoutId);

            // Reseta a interface antes de começar a nova história
            graphic.classList.remove('show');
            wrapOut.classList.remove('animate-in');
            wrapIn.classList.remove('animate-in');

            // Insere os novos dados
            teamName.innerText = data.team;
            renderPlayerDetails(data.out, 'out');
            renderPlayerDetails(data.in, 'in');

            // ETAPA 1: O Container surge
            setTimeout(() => {
                graphic.classList.add('show');

                // ETAPA 2: Pausa antes de descer o fundo branco do jogador que SAI (1 segundo)
                setTimeout(() => {
                    wrapOut.classList.add('animate-in');

                    // ETAPA 3: O grande suspense de quem vai entrar (2 segundos)
                    setTimeout(() => {
                        wrapIn.classList.add('animate-in');

                        // ETAPA 4: Tempo de leitura final (fica na tela e depois recolhe suavemente)
                        if (!data.manter) {
                            timeoutId = setTimeout(() => {
                                wrapIn.classList.remove('animate-in');
                                setTimeout(() => wrapOut.classList.remove('animate-in'), 600); // Recolhe o de sair
                                setTimeout(() => graphic.classList.remove('show'), 1200); // Apaga a aba azul
                            }, 8000); // 8 segundos para leitura
                        }

                    }, 2000); // <-- Tempo de suspense entre SAI e ENTRA

                }, 1000); // <-- Tempo de leitura apenas do cabeçalho azul

            }, 100);
        }

        onValue(ref(db, 'substituicao'), (snapshot) => {
            const data = snapshot.val();
            if (!data) return;

            if (data.hide === true) {
                graphic.classList.remove('show');
                wrapOut.classList.remove('animate-in');
                wrapIn.classList.remove('animate-in');
                return;
            }

            if (Date.now() - data.timestamp > 10000) return;

            if (data.timestamp !== lastTimestamp || data.manter) {
                lastTimestamp = data.timestamp;
                startStorylineAnimation(data);
            }
        });
    </script>
</body>
</html>
