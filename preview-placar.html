<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Arial Black', Impact, sans-serif; display: flex; align-items: flex-start; padding: 20px; }
        
        .scoreboard-wrapper {
            display: flex; align-items: center; background: rgba(10, 10, 20, 0.95);
            border: 2px solid rgba(255, 255, 255, 0.2); border-radius: 12px;
            padding: 8px 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.6); color: white; gap: 15px;
        }

        .match-info {
            display: flex; align-items: center; gap: 12px; font-size: 2rem;
            background: #111; padding: 5px 20px; border-radius: 8px;
        }

        /* Container do Time com Traço de Cartão */
        .team-box {
            display: flex; flex-direction: column; align-items: center; position: relative; padding-top: 6px;
        }
        .card-bar {
            position: absolute; top: 0; width: 100%; height: 4px; border-radius: 2px; display: none;
        }
        .card-bar.amarelo { background: #f59e0b; display: block; box-shadow: 0 0 8px #f59e0b; }
        .card-bar.vermelho { background: #ef4444; display: block; box-shadow: 0 0 8px #ef4444; }

        .team-abbr { font-weight: 900; letter-spacing: 2px; text-transform: uppercase; }
        .score { color: #f59e0b; font-weight: 900; }
        .divider { color: #555; font-size: 1.5rem; }
        .team-cruzeiro { color: #3b82f6; }

        /* Timer MM:SS e Acréscimo */
        .clock-container { display: flex; align-items: center; gap: 8px; font-size: 2rem; font-weight: 900; }
        .added-timer {
            background: #eab308; color: #000; font-size: 1.3rem; font-weight: 900;
            padding: 2px 8px; border-radius: 6px; display: none;
        }
        .added-timer.show { display: inline-block; }

        .status-msg { font-size: 2rem; font-weight: 900; color: #888; letter-spacing: 3px; padding: 5px 30px; }
    </style>
</head>
<body>

    <div class="scoreboard-wrapper" id="board">
        <div class="status-msg" id="status-display">OFF</div>

        <div class="match-info" id="match-display" style="display: none;">
            <div class="team-box">
                <div class="card-bar" id="card-home"></div>
                <span class="team-abbr" id="home-team">CASA</span>
            </div>
            <span class="score" id="home-score">0</span>
            <span class="divider">x</span>
            <span class="score" id="away-score">0</span>
            <div class="team-box">
                <div class="card-bar" id="card-away"></div>
                <span class="team-abbr" id="away-team">FORA</span>
            </div>
        </div>

        <div class="clock-container" id="clock-display" style="display: none;">
            <span id="timer-main">00:00</span>
            <span class="added-timer" id="timer-added">+00:00</span>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

        const config = { databaseURL: "https://termosm-6fed5-default-rtdb.firebaseio.com" }; 
        const db = getDatabase(initializeApp(config));
        
        const statusDisplay = document.getElementById('status-display');
        const matchDisplay = document.getElementById('match-display');
        const clockDisplay = document.getElementById('clock-display');
        const homeTeam = document.getElementById('home-team');
        const awayTeam = document.getElementById('away-team');
        const homeScore = document.getElementById('home-score');
        const awayScore = document.getElementById('away-score');
        const timerMain = document.getElementById('timer-main');
        const timerAdded = document.getElementById('timer-added');
        const cardHome = document.getElementById('card-home');
        const cardAway = document.getElementById('card-away');

        let mainSeconds = 0;
        let addedSeconds = 0;
        let timerInterval = null;
        let currentPeriod = 1;

        function formatTime(totalSec) {
            const m = String(Math.floor(totalSec / 60)).padStart(2, '0');
            const s = String(totalSec % 60).padStart(2, '0');
            return `${m}:${s}`;
        }

        function startLocalTimer() {
            if (timerInterval) return;
            timerInterval = setInterval(() => {
                const maxSec = 45 * 60; // 45 min por tempo
                if (mainSeconds < maxSec) {
                    mainSeconds++;
                    timerMain.innerText = formatTime(mainSeconds);
                } else {
                    // Trava o principal aos 45 min e incrementa o acréscimo
                    timerMain.innerText = formatTime(maxSec);
                    addedSeconds++;
                    timerAdded.innerText = `+${formatTime(addedSeconds)}`;
                    timerAdded.classList.add('show');
                }
            }, 1000);
        }

        function syncTimerWithAPI(apiMinutes, period) {
            if (period !== currentPeriod) {
                currentPeriod = period;
                mainSeconds = 0; // Reseta para 00:00 no 2º tempo
                addedSeconds = 0;
                timerAdded.classList.remove('show');
            }

            const apiSec = apiMinutes * 60;
            // Alinha o timer local se a divergência for maior que 10s
            if (Math.abs(mainSeconds - apiSec) > 10 && apiSec <= 45 * 60) {
                mainSeconds = apiSec;
            }
            startLocalTimer();
        }

        function setModo(modo) {
            if(modo === 'in' || modo === 'start' || modo === 'halftime') {
                statusDisplay.style.display = 'none';
                matchDisplay.style.display = 'flex';
                clockDisplay.style.display = 'flex';
            } else {
                statusDisplay.style.display = 'block';
                matchDisplay.style.display = 'none';
                clockDisplay.style.display = 'none';
                statusDisplay.innerText = modo.toUpperCase();
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }

        // LEITURA DO FIREBASE
        onValue(ref(db, 'tv/placar'), (snap) => {
            const data = snap.val();
            if (!data) return;

            if (data.status === 'off' || data.acao === 'reset') {
                setModo('off');
            } else {
                setModo(data.status);
                
                homeTeam.innerText = data.homeAbbr || "CASA";
                awayTeam.innerText = data.awayAbbr || "FORA";
                homeScore.innerText = data.homeScore ?? 0;
                awayScore.innerText = data.awayScore ?? 0;

                if (data.status === 'halftime' || data.clock === 'INT') {
                    clearInterval(timerInterval);
                    timerInterval = null;
                    timerMain.innerText = "INTERVALO";
                    timerAdded.classList.remove('show');
                    return;
                }

                const apiMin = parseInt(String(data.clock).replace(/\D/g, '')) || 0;
                syncTimerWithAPI(apiMin, data.period || 1);
            }
        });

        // LEITURA DE CARTÕES PARA OS TRAÇOS VISUAIS
        onValue(ref(db, 'tv/cartao'), (snap) => {
            const data = snap.val();
            if (!data) return;
            
            const targetBar = (data.teamAbbr === homeTeam.innerText) ? cardHome : cardAway;
            targetBar.className = `card-bar ${data.tipo}`;
        });
    </script>
</body>
</html>
